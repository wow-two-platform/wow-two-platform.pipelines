# The shared build-and-publish workflow every product calls from its .github/workflows/publish-docker-image.yml.
# It reads the product's engineering/deployment/deploy.yml, versions the build and publishes it:
#   main          → release vX.Y.Z: changed images tagged X.Y.Z, every image tagged latest, bundle on a GitHub release
#                   whose notes list the commits since the previous release above GitHub's generated notes
#   other branch  → candidate X.Y.(Z+1)-<branch>.<n>: images tagged sha-<commit>, bundle-<commit> artifact
#   commit input  → candidate X.Y.(Z+1)-g<commit> for a commit that has no build (Wheelhouse's Build action)
# A previous release whose source commit is not in the checked-out history (an author rewrite removed it) is not used
# as the base: every service rebuilds, and the job log and the release notes say so.
# Image layers go through the GitHub Actions cache, one scope per service, so unchanged stages are not rebuilt.
# delivery.yml calls it after ci; a product may still call it directly.
# Rules: wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md § Builds and versions.
name: publish

on:
  workflow_call:
    inputs:
      commit:
        description: A full commit SHA to build instead of the pushed commit
        type: string
        required: false
        default: ''
      main-branch:
        description: The branch whose builds are releases
        type: string
        required: false
        default: main
    outputs:
      status:
        description: "'built' when the run published a bundle, 'skipped' when no service or descriptor changed"
        value: ${{ jobs.bundle.outputs.status }}
      kind:
        description: "'release' on the main branch, else 'candidate'"
        value: ${{ jobs.bundle.outputs.kind }}
      release:
        description: The release tag or candidate version the run built
        value: ${{ jobs.bundle.outputs.release }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      actions: read
    outputs:
      status: ${{ steps.build.outputs.status }}
      kind: ${{ steps.build.outputs.kind }}
      release: ${{ steps.build.outputs.release }}
    concurrency:
      # One build per branch at a time, so a release reads the tag the previous one created.
      group: publish-${{ github.repository }}-${{ inputs.commit || github.ref }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.commit || github.sha }}
      BRANCH: ${{ inputs.commit == '' && github.ref_type == 'branch' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Fetch the Git LFS files under engineering/
        # Build contexts never leave engineering/, so its LFS files are all an image can contain; without this step
        # images would carry LFS pointer files. A repository without LFS fetches nothing.
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='engineering/**'
      - name: Check out the release generator at this workflow's own commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .pipelines
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Expose the Actions cache to Buildx
        # The gha cache backend needs the runtime token and cache URL, which only an action can read.
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the previous release's bundle as the base
        run: |
          set -euo pipefail
          product=$(python3 .pipelines/generator/release.py validate --repo . | python3 -c 'import json,sys; print(json.load(sys.stdin)["product"])')
          echo "PRODUCT=$product" >> "$GITHUB_ENV"
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          # The release notes list the commits since this release, and GitHub's generated notes start from it.
          echo "PREVIOUS_RELEASE=$previous" >> "$GITHUB_ENV"
          if [ -n "$previous" ] && gh release download "$previous" -p "$product-release.tar.gz" -D base-archive; then
            mkdir -p base
            tar -xzf "base-archive/$product-release.tar.gz" -C base
            echo "BASE_ARGUMENTS=--base base" >> "$GITHUB_ENV"
          fi
      - name: Version, build and tag the changed services, and write the bundle
        id: build
        run: |
          set -euo pipefail
          arguments=(ci --repo . --commit "$COMMIT" --main "${{ inputs.main-branch }}"
                     --registry "ghcr.io/${GITHUB_REPOSITORY,,}" --output bundle --cache gha)
          [ -n "$BRANCH" ] && arguments+=(--branch "$BRANCH")
          # A pinned image (another repository's image at a release tag) never builds: its tag resolves to the digest
          # the bundle pins, at every build.
          pins=$(python3 .pipelines/generator/release.py pins --repo . --commit "$COMMIT")
          while IFS=$'\t' read -r service reference; do
            if ! digest=$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' < /dev/null | jq -re .digest); then
              echo "::error title=pinned image::$service: $reference resolves to no digest; publish that tag, or make the image public" >&2
              exit 1
            fi
            echo "$service: $reference is $digest"
            arguments+=(--pin "$service=$digest")
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$pins")
          python3 .pipelines/generator/release.py "${arguments[@]}" ${BASE_ARGUMENTS:-}
      - name: Publish the release with its notes
        # The body: the commits since the previous release (release.py notes), then GitHub's generated notes — the
        # pull requests merged since it and the compare link. Wheelhouse shows these bodies before a promotion.
        if: steps.build.outputs.status == 'built' && steps.build.outputs.kind == 'release'
        env:
          # Set when the base release's source commit is not in this history and every service was rebuilt.
          BASE_WARNING: ${{ steps.build.outputs.warning }}
        run: |
          set -euo pipefail
          notes=(notes --repo . --commit "$COMMIT")
          start=()
          if [ -n "${PREVIOUS_RELEASE:-}" ]; then
            notes+=(--previous "$PREVIOUS_RELEASE")
            start=(--notes-start-tag "$PREVIOUS_RELEASE")
          fi
          if [ -n "${BASE_WARNING:-}" ]; then
            notes+=(--warning "$BASE_WARNING")
          fi
          python3 .pipelines/generator/release.py "${notes[@]}" > "$RUNNER_TEMP/release-notes.md"
          gh release create "${{ steps.build.outputs.release }}" "${{ steps.build.outputs.archive }}" \
            --target "$COMMIT" --title "${{ steps.build.outputs.release }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes "${start[@]}"
      - name: Upload the build's bundle
        if: steps.build.outputs.status == 'built' && steps.build.outputs.kind != 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ inputs.commit || github.sha }}
          path: bundle/
          retention-days: 14
