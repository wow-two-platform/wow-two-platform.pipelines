# CodeQL for a public repository, one job per language, without a build (build-mode none): a caller's codeql.yml runs
# it weekly and on main pushes, apart from delivery, so it never adds time to a delivery run. Results land in the
# repository's Security tab. Private repositories on the Free plan cannot use code scanning; they do not call it.
# This repository scans itself through the same file (Python and its workflows).
name: codeql

on:
  workflow_call:
    inputs:
      languages:
        description: JSON list of CodeQL languages, such as ["csharp", "javascript-typescript", "python", "actions"]
        type: string
        required: true
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  schedule:
    - cron: '23 2 * * 1'

concurrency:
  group: codeql-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages || '["python", "actions"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
