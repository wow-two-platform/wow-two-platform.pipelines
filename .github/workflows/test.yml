# Runs the release generator's tests on each push and pull request.
name: test

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 -B -m unittest -v test_release
        working-directory: generator
