# Runs the generator's and the CI planner's tests, and lints the workflows, on each push and pull request that changes
# more than markdown.
name: test

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 -B -m unittest -v test_release test_ci_plan
        working-directory: generator

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 predates the job.workflow_* and reusable-workflow jobs.<id>.result contexts GitHub serves.
      - run: >-
          docker run --rm -e SHELLCHECK_OPTS=--severity=warning -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -color -ignore 'property "workflow_(repository|sha)" is not defined'
          -ignore 'property "result" is not defined in object type \{outputs'

  buildx-cache:
    name: Buildx layer cache
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # The cache flags publish passes (release.py build_image, cache "gha") on a throwaway image: export, then import.
      # Buildx 4 prints no CACHED line for a layer it pulls from the remote cache, so a reused layer is told by its
      # content: the stamp is a fresh uuid per execution and survives the second build only through the cache.
      - name: Build twice through the gha cache
        run: |
          set -euo pipefail
          context=$(mktemp -d)
          printf 'FROM busybox:1.37\nRUN echo "%s" > /run\nRUN cat /proc/sys/kernel/random/uuid > /stamp\n' "$GITHUB_RUN_ID" > "$context/Dockerfile"
          flags=$(python3 -c 'import sys; sys.path.insert(0, "generator"); import release; print(" ".join(release.cache_flags("gha", "smoke")))')
          # shellcheck disable=SC2086
          docker buildx build $flags --load -t cache-smoke "$context"
          first=$(docker run --rm cache-smoke cat /stamp)
          # Empty the builder, so the second build can only reuse its layers through the gha cache.
          docker buildx prune --all --force
          # shellcheck disable=SC2086
          docker buildx build $flags --load -t cache-smoke "$context"
          second=$(docker run --rm cache-smoke cat /stamp)
          echo "first=$first second=$second"
          test "$first" = "$second"
