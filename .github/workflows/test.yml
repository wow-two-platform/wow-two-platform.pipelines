# Runs the generator's and the CI planner's tests, and lints the workflows, on each push and pull request that changes
# more than markdown.
name: test

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: python3 -B -m unittest -v test_release test_ci_plan
        working-directory: generator

  workflows:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # actionlint 1.7.12 predates the job.workflow_* and reusable-workflow jobs.<id>.result contexts GitHub serves.
      - run: >-
          docker run --rm -e SHELLCHECK_OPTS=--severity=warning -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12
          -color -ignore 'property "workflow_(repository|sha)" is not defined'
          -ignore 'property "result" is not defined in object type \{outputs'
